<script>
  // GitHub Username und Repository-Name anpassen
  const USERNAME = 'DEIN_GITHUB_USERNAME';
  const REPO = 'DEIN_REPO_NAME';

  async function loadApps() {
    const listElement = document.getElementById('app-list');

    try {
      // 1. Liste aller Dateien im Repository abrufen
      const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
      const files = await response.json();

      // Nur HTML-Dateien filtern und index.html ausschließen
      const htmlFiles = files.filter(file => 
        file.name.endsWith('.html') && file.name !== 'index.html'
      );

      listElement.innerHTML = '';

      if (htmlFiles.length === 0) {
        listElement.innerHTML = '<li>Keine weiteren HTML-Dateien gefunden.</li>';
        return;
      }

      const parser = new DOMParser();

      // 2. Jede HTML-Datei abrufen und den Titel extrahieren
      for (const file of htmlFiles) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        
        a.href = file.name;
        // Vorübergehender Text, während der Titel geladen wird
        a.textContent = file.name.replace('.html', '') + ' (Lade Titel...)';
        li.appendChild(a);
        listElement.appendChild(li);

        // Datei-Inhalt abrufen und parsen
        try {
          const docResponse = await fetch(file.name);
          const htmlText = await docResponse.text();
          const doc = parser.parseFromString(htmlText, 'text/html');

          // <title>-Tag auslesen
          const titleTag = doc.querySelector('title');
          const titleText = titleTag && titleTag.textContent.trim() 
            ? titleTag.textContent.trim() 
            : file.name.replace('.html', '');

          // Optional: Meta-Description auslesen (falls vorhanden)
          const metaDesc = doc.querySelector('meta[name="description"]');
          const descText = metaDesc ? metaDesc.getAttribute('content') : '';

          // Link-Inhalt aktualisieren
          a.innerHTML = `<strong>${titleText}</strong>` + 
            (descText ? `<br><small style="color: #666;">${descText}</small>` : '');

        } catch (fileErr) {
          // Fallback, falls eine Datei nicht geladen werden konnte
          a.textContent = file.name.replace('.html', '');
        }
      }

    } catch (error) {
      listElement.innerHTML = '<li>Fehler beim Laden der Apps.</li>';
      console.error(error);
    }
  }

  loadApps();
</script>
